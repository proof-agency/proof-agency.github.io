name: CH11 U06 exact runtime gate

on:
  push:
    branches:
      - ch11-u06-runtime
    paths:
      - ".github/workflows/ch11-u06-runtime-preflight.yml"
      - ".github/ch11_u06_runtime_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-runtime-preflight:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision exact Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          check-latest: true

      - name: Record interpreter
        run: |
          python --version
          which python
          python - <<'PY'
          import os, platform, sys
          print("python", platform.python_version())
          print("executable", sys.executable)
          print("PYTHONHASHSEED", os.environ.get("PYTHONHASHSEED"))
          PY

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install exact Stage-5 pins
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip install \
            numpy==2.5.3 \
            scipy==1.18.1 \
            pandas==3.0.6 \
            torch==2.14.0 \
            statsmodels==0.15.0 \
            arch==8.0.0 \
            matplotlib==3.11.2 \
            2>&1 | tee CH11_U06_EXACT_INSTALL.log

      - name: Freeze environment
        if: always()
        shell: bash
        run: |
          python -m pip freeze > CH11_U06_GITHUB_ACTIONS_PIP_FREEZE.txt || true
          python - <<'PY' > CH11_U06_GITHUB_ACTIONS_RUNTIME_SNAPSHOT.txt
          import os, platform, sys, importlib
          print("python", platform.python_version())
          print("executable", sys.executable)
          print("platform", platform.platform())
          print("PYTHONHASHSEED", os.environ.get("PYTHONHASHSEED"))
          for name in ["numpy","scipy","pandas","torch","statsmodels","arch","matplotlib"]:
              try:
                  m=importlib.import_module(name)
                  print(name, getattr(m,"__version__","UNKNOWN"))
              except Exception as e:
                  print(name, "IMPORT_ERROR", repr(e))
          try:
              import torch
              print("torch.cuda.is_available", torch.cuda.is_available())
              print("torch.cuda.device_count", torch.cuda.device_count())
          except Exception as e:
              print("torch_probe_error", repr(e))
          PY

      - name: Run locked U06 preflight
        id: preflight
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python .github/ch11_u06_runtime_preflight.py \
            2>&1 | tee CH11_U06_RUNTIME_PREFLIGHT_STDOUT.txt

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          sha256sum \
            CH11_U06_EXACT_INSTALL.log \
            CH11_U06_GITHUB_ACTIONS_PIP_FREEZE.txt \
            CH11_U06_GITHUB_ACTIONS_RUNTIME_SNAPSHOT.txt \
            CH11_U06_RUNTIME_PREFLIGHT_STDOUT.txt \
            CH11_U06_RUNTIME_PREFLIGHT_RESULT.json \
            > CH11_U06_GITHUB_ACTIONS_SHA256.txt || true

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch11-u06-exact-runtime-evidence
          if-no-files-found: error
          path: |
            CH11_U06_EXACT_INSTALL.log
            CH11_U06_GITHUB_ACTIONS_PIP_FREEZE.txt
            CH11_U06_GITHUB_ACTIONS_RUNTIME_SNAPSHOT.txt
            CH11_U06_RUNTIME_PREFLIGHT_STDOUT.txt
            CH11_U06_RUNTIME_PREFLIGHT_RESULT.json
            CH11_U06_GITHUB_ACTIONS_SHA256.txt

      - name: Enforce exact-runtime gate
        if: always()
        shell: bash
        run: |
          echo "install outcome: ${{ steps.install.outcome }}"
          echo "preflight outcome: ${{ steps.preflight.outcome }}"
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.preflight.outcome }}" = "success"
