name: CH12 U02 Attention Oracle
on:
  push:
    branches:
      - ch12-u02-runtime
    paths:
      - ".github/ch12_stage5_attention_mask_shift_oracle.py"
      - ".github/workflows/ch12_u02_attention_oracle.yml"
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
          cache: "pip"
      - name: Runtime identity
        run: |
          python --version
          python -c "import sys; print(sys.version)"
      - name: Install exact PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0
      - name: Verify frozen source SHA
        run: |
          sha256sum .github/ch12_stage5_attention_mask_shift_oracle.py
          test "$(sha256sum .github/ch12_stage5_attention_mask_shift_oracle.py | awk '{print $1}')" = "2f7a638b7928bc07aa066997ed98d79c477e4135f6fcd05546e638bd37aab851"
      - name: Run exact oracle
        run: |
          python .github/ch12_stage5_attention_mask_shift_oracle.py | tee CH12_ATTENTION_MASK_SHIFT_ORACLE_STDOUT.txt
      - name: Freeze environment
        run: |
          python -m pip freeze > CH12_U02_PIP_FREEZE.txt
          python - <<'PY'
          import sys, json, platform, torch
          p = {
            "python": sys.version,
            "torch": torch.__version__,
            "platform": platform.platform(),
            "processor": platform.processor(),
            "machine": platform.machine(),
          }
          open("CH12_U02_RUNTIME_IDENTITY.json","w",encoding="utf-8").write(json.dumps(p,indent=2,sort_keys=True))
          PY
      - name: Evidence manifest
        run: |
          cp .github/ch12_stage5_attention_mask_shift_oracle.py CH12_STAGE5_ATTENTION_MASK_SHIFT_ORACLE.py
          sha256sum CH12_STAGE5_ATTENTION_MASK_SHIFT_ORACLE.py CH12_ATTENTION_MASK_SHIFT_ORACLE_RESULT.json CH12_ATTENTION_MASK_SHIFT_ORACLE_STDOUT.txt CH12_U02_PIP_FREEZE.txt CH12_U02_RUNTIME_IDENTITY.json > CH12_U02_RUNTIME_EVIDENCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ch12-u02-attention-oracle-evidence
          path: |
            CH12_STAGE5_ATTENTION_MASK_SHIFT_ORACLE.py
            CH12_ATTENTION_MASK_SHIFT_ORACLE_RESULT.json
            CH12_ATTENTION_MASK_SHIFT_ORACLE_STDOUT.txt
            CH12_U02_PIP_FREEZE.txt
            CH12_U02_RUNTIME_IDENTITY.json
            CH12_U02_RUNTIME_EVIDENCE_SHA256.txt
          if-no-files-found: error
